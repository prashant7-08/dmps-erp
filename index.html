<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Dadheech Memorial Public School — Official Portal & ERP</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b1e38" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DMPS ERP" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- Modern Google Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased font-sans transition-colors duration-200">
    <div id="root">
      <div id="initial-loader" style="position: fixed; inset: 0; background: linear-gradient(135deg, #0b1e38 0%, #112a4d 50%, #071526 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #ffffff; padding: 20px;">
        <div style="position: relative; width: 100px; height: 100px; margin-bottom: 24px; display: flex; align-items: center; justify-content: center;">
          <!-- Pulsing Ring -->
          <div style="position: absolute; inset: -10px; border-radius: 50%; border: 2px solid rgba(245, 158, 11, 0.4); animation: dmps-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
          <!-- Rotating Gold Spinner -->
          <div style="position: absolute; inset: -4px; border-radius: 50%; border: 3px solid transparent; border-top-color: #f59e0b; border-right-color: #38bdf8; animation: dmps-spin 1.2s linear infinite;"></div>
          <!-- School Logo Emblem -->
          <img src="/logo.png" alt="DMPS Logo" style="width: 80px; height: 80px; border-radius: 50%; object-fit: contain; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; z-index: 2;" onerror="this.style.display='none'; document.getElementById('loader-fallback-icon').style.display='flex';" />
          <div id="loader-fallback-icon" style="display: none; width: 80px; height: 80px; border-radius: 50%; background: #1e3a8a; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: #f59e0b; border: 2px solid #f59e0b;">🏫</div>
        </div>
        
        <h2 style="font-size: 18px; font-weight: 800; letter-spacing: 0.5px; margin: 0 0 6px 0; color: #f8fafc; text-align: center; text-transform: uppercase;">
          Dadheech Memorial Public School
        </h2>
        <p style="font-size: 13px; color: #94a3b8; margin: 0 0 20px 0; text-align: center; font-weight: 500;">
          Official Portal & Academic ERP
        </p>

        <!-- Loading Progress Bar -->
        <div style="width: 220px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; position: relative;">
          <div style="position: absolute; height: 100%; width: 50%; background: linear-gradient(90deg, #f59e0b, #38bdf8); border-radius: 999px; animation: dmps-progress 1.5s ease-in-out infinite;"></div>
        </div>
        
        <p id="loader-status-text" style="font-size: 11px; color: #64748b; margin-top: 14px; font-weight: 700; letter-spacing: 0.8px;">
          LOADING APPLICATION DATA...
        </p>

        <!-- Offline Status Banner -->
        <div id="offline-banner" style="display: none; margin-top: 20px; padding: 8px 18px; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 999px; font-size: 12px; color: #fca5a5; font-weight: 700; align-items: center; gap: 6px;">
          ⚡ No Internet Detected • Waiting for connection...
        </div>
      </div>
      <style>
        @keyframes dmps-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes dmps-pulse { 0%, 100% { opacity: 0.2; transform: scale(0.95); } 50% { opacity: 0.8; transform: scale(1.1); } }
        @keyframes dmps-progress { 0% { left: -50%; width: 35%; } 50% { left: 30%; width: 60%; } 100% { left: 100%; width: 35%; } }
      </style>
      <script>
        if (typeof navigator !== 'undefined' && !navigator.onLine) {
          var ob = document.getElementById('offline-banner');
          if (ob) ob.style.display = 'flex';
          var st = document.getElementById('loader-status-text');
          if (st) st.innerText = 'OFFLINE • WAITING FOR NETWORK...';
        }
        window.addEventListener('online', function() {
          var ob = document.getElementById('offline-banner');
          if (ob) ob.style.display = 'none';
          var st = document.getElementById('loader-status-text');
          if (st) st.innerText = 'CONNECTING TO CLOUD...';
        });
        window.addEventListener('offline', function() {
          var ob = document.getElementById('offline-banner');
          if (ob) ob.style.display = 'flex';
          var st = document.getElementById('loader-status-text');
          if (st) st.innerText = 'OFFLINE • WAITING FOR NETWORK...';
        });
      </script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
